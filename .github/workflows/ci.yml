name: CI

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.changed-files.outputs.ansible_any_changed }}
      terraform: ${{ steps.changed-files.outputs.terraform_any_changed }}
    steps:
      - uses: actions/checkout@v7

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            ansible:
              - src/ansible/**
              - .github/workflows/ansible-lint.yml
              - .github/workflows/ci.yml
            terraform:
              - src/tf/**
              - .github/workflows/tf-validate.yml
              - .github/workflows/ci.yml

  ansible-lint:
    if: needs.changes.outputs.ansible == 'true'
    needs: changes
    uses: glitchedmob/infra-gha/.github/workflows/ansible-lint.yml@v0.7.4
    with:
      working-directory: src/ansible

  terraform-validate:
    if: needs.changes.outputs.terraform == 'true'
    needs: changes
    uses: glitchedmob/infra-gha/.github/workflows/tf-validate.yml@v0.7.4
    with:
      init-backend: false

  ci-checks:
    name: CI checks
    if: always()
    needs:
      - changes
      - ansible-lint
      - terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          allowed-skips: ansible-lint, terraform-validate
          jobs: ${{ toJSON(needs) }}
