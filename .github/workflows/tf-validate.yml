name: Terraform Validate

on:
  push:
    branches:
      - main
    paths:
      - src/tf/**
      - .github/workflows/tf-validate.yml

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    uses: glitchedmob/infra-gha/.github/workflows/tf-validate.yml@v0.7.4
    with:
      init-backend: false
