---
all:
  children:
    proxmox_x86_cluster:
      vars:
        cluster_name: pve-x86
        primary_node: x86-node-01
      hosts:
        x86-node-01: &x86_node_01
          ansible_host: 10.0.0.3
          proxmox_api_password: "{{ lookup('env', 'X86_NODE_01_SSH_PASS', default=undef()) }}"
          ssm_tailscale_authkey_path: "/homelab/headscale/proxmox/x86-node-01-auth-key"
          ssm_monitor_push_url_path: "/homelab/monitor/proxmox/x86-node-01-monitor-push-url"
          os_disk: /dev/disk/by-id/nvme-WD_BLACK_SN770M_2TB_255212800414
          vmdata_disk: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_4TB_S7KGNJ0WB00297R
        x86-node-02: &x86_node_02
          ansible_host: 10.0.0.4
          proxmox_api_password: "{{ lookup('env', 'X86_NODE_02_SSH_PASS', default=undef()) }}"
          ssm_tailscale_authkey_path: "/homelab/headscale/proxmox/x86-node-02-auth-key"
          ssm_monitor_push_url_path: "/homelab/monitor/proxmox/x86-node-02-monitor-push-url"
          os_disk: /dev/disk/by-id/ata-Samsung_SSD_850_EVO_250GB_S21NNSAFC65434J
          vmdata_disk: /dev/disk/by-id/nvme-Samsung_SSD_9100_PRO_with_Heatsink_4TB_S7ZRNJ0Y504262D
        x86-node-03: &x86_node_03
          ansible_host: 10.0.0.5
          proxmox_api_password: "{{ lookup('env', 'X86_NODE_03_SSH_PASS', default=undef()) }}"
          ssm_tailscale_authkey_path: "/homelab/headscale/proxmox/x86-node-03-auth-key"
          os_disk: /dev/disk/by-id/ata-SanDisk_SDSSDH3_250G_215258800906
          vmdata_disk: /dev/disk/by-id/nvme-Samsung_SSD_9100_PRO_with_Heatsink_4TB_S7ZRNJ0Y504254P

    proxmox_arm_cluster:
      hosts: {}

    # Canonical names use the shared SSM key. Bootstrap aliases are not cluster members.
    proxmox_nodes:
      children:
        proxmox_x86_cluster:
        proxmox_arm_cluster:
      vars:
        ansible_ssh_private_key: "{{ lookup('amazon.aws.aws_ssm', ssm_private_key_path, region=ssm_region) }}"
        ansible_ssh_common_args: "-o IdentityAgent=SSH_AUTH_SOCK -o IdentitiesOnly=yes"
        ansible_control_path_dir: "~/.ansible/cp/proxmox-configured"
        tailscale_login_server: "https://headscale.levizitting.com"
        tailscale_advertise_routes: "10.0.0.0/24,10.20.0.0/16"

    # Separate inventory names let the same machine have independent connection variables.
    bootstrap:
      vars:
        management_gateway: 10.0.0.1
        management_vlan: 11
        ansible_ssh_common_args: "-o IdentityAgent=none -o PubkeyAuthentication=no -o PreferredAuthentications=password"
        ansible_control_path_dir: "~/.ansible/cp/proxmox-bootstrap"
      hosts:
        x86-node-01-bootstrap:
          <<: *x86_node_01
          ansible_ssh_pass: "{{ lookup('env', 'X86_NODE_01_SSH_PASS', default=undef()) }}"
        x86-node-02-bootstrap:
          <<: *x86_node_02
          ansible_ssh_pass: "{{ lookup('env', 'X86_NODE_02_SSH_PASS', default=undef()) }}"
        x86-node-03-bootstrap:
          <<: *x86_node_03
          ansible_ssh_pass: "{{ lookup('env', 'X86_NODE_03_SSH_PASS', default=undef()) }}"
  vars:
    ansible_user: root
    ssm_region: us-east-2
    ssm_private_key_path: "/infra/lz/infra-on-prem/ssh-private-key"
    ssm_public_key_path: "/infra/lz/infra-on-prem/ssh-public-key"
